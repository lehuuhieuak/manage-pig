name: manage-pig

services:
  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: "${DATABASE_URL:?Vui lòng cấu hình DATABASE_URL trong .env}"
      DEFAULT_FAMILY_ID: "${DEFAULT_FAMILY_ID:-00000000-0000-4000-8000-000000000001}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  web:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: "${DATABASE_URL:?Vui lòng cấu hình DATABASE_URL trong .env}"
      DEFAULT_FAMILY_ID: "${DEFAULT_FAMILY_ID:-00000000-0000-4000-8000-000000000001}"
      APP_ORIGIN: "${APP_ORIGIN:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/data', { signal: AbortSignal.timeout(5000) }).then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 7s
      start_period: 20s
      retries: 3
